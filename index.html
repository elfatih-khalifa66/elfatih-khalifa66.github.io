<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14283f">
<title>Elfatih Khalifa | Digital Business Card</title>
<style>
:root{--navy:#14283f;--navy2:#1c3854;--gold:#d8b66b;--ink:#172536;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e9edf2,#dce4ec);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.card{width:min(100%,430px);background:var(--navy);color:white;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px #14283f30}
.top{padding:32px 28px 26px;background:linear-gradient(145deg,var(--navy),var(--navy2));position:relative}
.mark{width:58px;height:58px;border:1px solid #d8b66b99;border-radius:16px;display:grid;place-items:center;color:var(--gold);font-size:23px;font-weight:700;letter-spacing:1px;margin-bottom:24px}
.kicker{font-size:10px;letter-spacing:2.4px;color:var(--gold);font-weight:700}
h1{font-size:30px;line-height:1.15;margin:10px 0 9px;letter-spacing:-.7px}
.role{color:#d9e2ec;font-size:14px;line-height:1.5}
.company{margin-top:20px;color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.5px}
.details{padding:24px 28px 28px;background:#fff;color:var(--ink)}
.item{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid #e9edf2;font-size:14px;overflow-wrap:anywhere}
.item:last-of-type{border-bottom:0}
.ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#f4f0e6;color:#9b7936;display:grid;place-items:center;font-size:15px}
a{color:var(--ink);text-decoration:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 12px;font-weight:700;font-size:13px;text-decoration:none}
.primary{background:var(--navy);color:#fff}.secondary{border:1px solid #d9c99e;color:var(--navy);background:#fff}
.foot{text-align:center;padding:0 20px 22px;color:#9fb0c1;background:#fff;font-size:10px;letter-spacing:1.6px}
@media(max-width:360px){h1{font-size:26px}.top,.details{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<main class="card">
  <section class="top">
    <div class="mark">EK</div>
    <div class="kicker">PERSONAL DIGITAL BUSINESS CARD</div>
    <h1>Elfatih Khalifa</h1>
    <div class="role">ERP System Developer &amp; Administrator</div>
    <div class="company">VISUALSOFT COMPANY</div>
  </section>
  <section class="details">
    <div class="item"><span class="ico">☎</span><a href="tel:+966553678380">+966 55 367 8380</a></div>
    <div class="item"><span class="ico">✉</span><a href="mailto:elfatih2009m2009@gmail.com">elfatih2009m2009@gmail.com</a></div>
    <div class="actions">
      <a class="btn primary" href="contact.vcf" download="Elfatih-Khalifa.vcf">＋ Save Contact</a>
      <a class="btn secondary" href="mailto:elfatih2009m2009@gmail.com">✉ Email Me</a>
    </div>
  </section>
  <div class="foot">ERP SYSTEMS · DEVELOPMENT · ADMINISTRATION</div>
</main>
</body>
</html>
